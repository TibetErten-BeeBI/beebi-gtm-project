resources:
  jobs:
    PE_End_To_End_Pipeline:
      name: PE_End_To_End_Pipeline
      tasks:
        - task_key: check_run_base_data
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.run_base_data}}"
            right: yes
        - task_key: base_data_build
          depends_on:
            - task_key: check_run_base_data
              outcome: "true"
          spark_python_task:
            python_file: /Workspace/Users/vadali.tejasviram@beebi-consulting.com/PE_work/src/priceelasticity/scripts/preprocessing/generic_dataset_to_pe_base_data.py
            parameters:
              - --input_format
              - delta
              - --input_path
              - workspace.default.grocery_raw_flat
              - --output_schema
              - workspace.default
              - --table_prefix
              - grocery
              - --product_col
              - group_article_id
              - --store_col
              - store_number
              - --date_col
              - week_start_date
              - --week_col
              - wm_yr_wk
              - --quantity_col
              - sold_quantity
              - --price_col
              - actual_retail_price
              - --base_price_col
              - average_zone_retail_price
              - --discount_col
              - discount_pct
              - --category_col
              - category
              - --product_type_col
              - product_type
              - --product_division_col
              - product_division
              - --country_col
              - country
              - --stock_col
              - stock_quantity
              - --inventory_col
              - inventory_quantity
          environment_key: Default
        - task_key: skip_base_data
          depends_on:
            - task_key: check_run_base_data
              outcome: "false"
          spark_python_task:
            python_file: /Workspace/Users/vadali.tejasviram@beebi-consulting.com/PE_work/src/priceelasticity/scripts/skip_basedata_trigger.py
          environment_key: Default
        - task_key: feature_engineering
          depends_on:
            - task_key: skip_base_data
            - task_key: base_data_build
          run_if: AT_LEAST_ONE_SUCCESS
          spark_python_task:
            python_file: /Workspace/Users/vadali.tejasviram@beebi-consulting.com/PE_work/src/priceelasticity/scripts/preprocessing/pe_causal_feature_engineering_dev.py
            parameters:
              - --output_schema
              - workspace.default
              - --table_prefix
              - grocery
          environment_key: Default
        - task_key: causal_mixed_linear_model
          depends_on:
            - task_key: feature_engineering
          spark_python_task:
            python_file: /Workspace/Users/vadali.tejasviram@beebi-consulting.com/PE_work/src/priceelasticity/scripts/models/causal_model_dev.py
            parameters:
              - --output_schema
              - workspace.default
              - --table_prefix
              - grocery
          environment_key: Default
        - task_key: predictive_model_arma
          depends_on:
            - task_key: causal_mixed_linear_model
          spark_python_task:
            python_file: /Workspace/Users/vadali.tejasviram@beebi-consulting.com/PE_work/src/priceelasticity/scripts/models/predictive_model_dev.py
            parameters:
              - --output_schema
              - workspace.default
              - --table_prefix
              - grocery
          environment_key: Default
        - task_key: final_price_elasticity_engine
          depends_on:
            - task_key: predictive_model_arma
          spark_python_task:
            python_file: /Workspace/Users/vadali.tejasviram@beebi-consulting.com/PE_work/src/priceelasticity/scripts/models/price_elasticity_engine.py
            parameters:
              - --output_schema
              - workspace.default
              - --table_prefix
              - grocery
          environment_key: Default
      queue:
        enabled: true
      parameters:
        - name: run_base_data
          default: yes
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
